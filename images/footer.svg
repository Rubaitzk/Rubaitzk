<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Thanks for stopping by" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#581c87"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="120" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="120" fill="url(#bg)"/>

    <g opacity="0.35">
      <path fill="#8b5cf6" d="M0 70 Q150 40 300 70 T600 70 T900 70 T1200 70 T1500 70 T1800 70 T2100 70 T2400 70 V120 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.3">
      <path fill="#ec4899" d="M0 85 Q150 105 300 85 T600 85 T900 85 T1200 85 T1500 85 T1800 85 T2100 85 T2400 85 V120 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.45">
      <path fill="#06b6d4" d="M0 100 Q150 86 300 100 T600 100 T900 100 T1200 100 T1500 100 T1800 100 T2100 100 T2400 100 V120 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="600" y="48" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="18" fill="#c4b5fd">Thanks for stopping by. Let's build something great.</text>
  </g>
</svg>
