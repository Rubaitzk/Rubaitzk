<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Muhammad Rubait Zakria, Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>

    <!-- soft glows -->
    <circle cx="1020" cy="50" r="190" fill="#8b5cf6" opacity="0.18"/>
    <circle cx="120" cy="250" r="170" fill="#ec4899" opacity="0.12"/>

    <!-- big decorative code glyph -->
    <text x="900" y="185" font-family="'Courier New', Consolas, monospace" font-size="170" font-weight="700" fill="#ffffff" opacity="0.05">&lt;/&gt;</text>

    <!-- floating particles -->
    <circle cx="820" cy="70" r="3" fill="#a78bfa">
      <animate attributeName="cy" values="70;40;70" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="150" r="2.5" fill="#ec4899">
      <animate attributeName="cy" values="150;120;150" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="90" r="3.5" fill="#06b6d4">
      <animate attributeName="cy" values="90;60;90" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="140" r="2" fill="#c4b5fd">
      <animate attributeName="cy" values="140;115;140" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- animated waves (seamless loop, period 600) -->
    <g opacity="0.35">
      <path fill="#8b5cf6" d="M0 232 Q150 202 300 232 T600 232 T900 232 T1200 232 T1500 232 T1800 232 T2100 232 T2400 232 V260 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.3">
      <path fill="#ec4899" d="M0 240 Q150 262 300 240 T600 240 T900 240 T1200 240 T1500 240 T1800 240 T2100 240 T2400 240 V260 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.45">
      <path fill="#06b6d4" d="M0 248 Q150 232 300 248 T600 248 T900 248 T1200 248 T1500 248 T1800 248 T2100 248 T2400 248 V260 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- text -->
    <text x="70" y="82" font-family="'Courier New', Consolas, monospace" font-size="20" fill="#a78bfa">&gt; hello, world</text>
    <rect x="238" y="66" width="11" height="18" fill="#a78bfa">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="68" y="150" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">Muhammad Rubait Zakria</text>

    <text x="70" y="192" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#c4b5fd">Software Engineer  •  NUST  •  Intelligent Systems &amp; Scalable Backends</text>
  </g>
</svg>
